name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tests, tutorials
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # core/cpsat_solver.py requires this exact upstream commit at external/job_shop_benchmark.
      - name: Fetch pinned upstream benchmark
        uses: actions/checkout@v4
        with:
          repository: ai-for-decision-making-tue/Job_Shop_Scheduling_Benchmark_Environments_and_Instances
          ref: d088a26582f5cb79c6b4f2ad94f68ac7c50878cb
          path: external/job_shop_benchmark

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-benchmark.txt

      # Application and UI share one compatible lock; notebook tooling is separate.
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install nbclient==0.11.0 nbformat==5.11.1 ipykernel==7.4.0
          python -m pip check

      # ml_experiments is left out until the style findings in prepare_data.py are fixed.
      - name: Ruff
        run: python -m ruff check core benchmarks tests ui

      - name: Tests
        run: python -m pytest -q tests

      - name: Run tutorial notebooks
        run: |
          python - <<'EOF'
          import glob
          import nbformat
          from nbclient import NotebookClient

          for path in sorted(glob.glob("tutorials/*.ipynb")):
              notebook = nbformat.read(path, as_version=4)
              NotebookClient(notebook, timeout=600, kernel_name="python3",
                             resources={"metadata": {"path": "tutorials"}}).execute()
              print("OK", path)
          EOF
