# Streamlit reads this from the repo root (`streamlit run ui/app.py`).
# Defining both themes lets users switch day/night mode from the ⋮ menu; "System" follows the OS.

[theme]
showSidebarBorder = true

[theme.light]
primaryColor = "#C2410C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#31333F"

[theme.light.sidebar]
backgroundColor = "#FAF7F2"
secondaryBackgroundColor = "#FFFFFF"

[theme.dark]
primaryColor = "#F97316"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#262730"
textColor = "#FAFAFA"

[theme.dark.sidebar]
backgroundColor = "#161B26"
secondaryBackgroundColor = "#0E1117"

[browser]
gatherUsageStats = false
